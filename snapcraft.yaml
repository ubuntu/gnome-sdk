    override-build: |
      set -eux
      craftctl default

      # Drop all the duplicates *.so.* library files that have been pulled from
      # deb files and that we're already shipping as part of source-compiled parts
      cd $CRAFT_STAGE/usr
      find . -type f,l -exec rm -fv $CRAFT_PART_INSTALL/usr/{} \;
      find . -type f,l -name "*.so.*" -exec sh -c "rm -fv $CRAFT_PART_INSTALL/usr/{}*" \;
      cd $CRAFT_STAGE/usr/lib
      find . -type f,l -exec rm -fv $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/{} \;
      find . -type f,l -name "*.so.*" -exec sh -c "rm -fv $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/{}*" \;
      cd $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      find . -type f,l -exec rm -fv $CRAFT_PART_INSTALL/usr/lib/{} \;
      find . -type f,l -name "*.so.*" -exec sh -c "rm -fv $CRAFT_PART_INSTALL/usr/lib/{}*" \;
    override-stage: |
      set -eux
      craftctl default
      PYTHONDONTWRITEBYTECODE=1 $CRAFT_PROJECT_DIR/tools/check_broken_links.py $CRAFT_STAGE
    stage:
      - -usr/bin/fc-cache
      - to riscv64:
        - -usr/lib/tcl8.6/graphviz/libtcldot.so
        - -usr/lib/tcl8.6/graphviz/libtclplan.so
        - -usr/lib/tcl8.6/graphviz/libtcldot_builtin.so
        - -usr/lib/tcl8.6/graphviz/libgdtclft.so
      - to armhf:
        - -usr/lib/tcl8.6/graphviz/libtcldot.so
        - -usr/lib/tcl8.6/graphviz/libtclplan.so
        - -usr/lib/tcl8.6/graphviz/libtcldot_builtin.so
        - -usr/lib/tcl8.6/graphviz/libgdtclft.so

  conditioning:
    after:
      - debs
      - gobject-introspection
      - libtool
    plugin: nil
    build-environment: *buildenv
    build-packages:
      - execstack
    override-prime: |
      set -eux
      craftctl default

      glib-compile-schemas usr/share/glib-2.0/schemas
      update-mime-database usr/share/mime
      for dir in usr/share/icons/*; do
        if [ -f "$dir/index.theme" ]; then
          gtk-update-icon-cache --force "$dir"
        fi
      done

      for PC in $(find . -path "*/pkgconfig/*.pc")
      do
        sed -i 's#prefix=$CRAFT_STAGE${pcfiledir}#prefix=${pcfiledir}#' $PC
        sed -i 's#prefix=$CRAFT_STAGE#prefix=/snap/$CRAFT_PROJECT_NAME/current#' $PC
        sed -i 's#prefix = /usr#prefix=/snap/$CRAFT_PROJECT_NAME/current/usr#' $PC
        sed -i 's#prefix=/usr#prefix=/snap/$CRAFT_PROJECT_NAME/current/usr#' $PC
        sed -i 's#original_prefix=/snap/$CRAFT_PROJECT_NAME/current/usr#original_prefix=/usr#' $PC

        sed -i 's#libdir=/usr#libdir=${prefix}#' $PC
        sed -i 's#libdir=/lib#libdir=/snap/$CRAFT_PROJECT_NAME/current/lib#' $PC

        sed -i 's#exec_prefix=/usr#exec_prefix=${prefix}#' $PC
        sed -i 's#includedir=/usr#includedir=${prefix}#' $PC
        sed -i 's#sysconfdir=/etc#sysconfdir=/snap/$CRAFT_PROJECT_NAME/current/etc#' $PC

        sed -i 's#/usr/#/snap/$CRAFT_PROJECT_NAME/current/usr/#g' $PC
        sed -i 's#/etc/#/snap/$CRAFT_PROJECT_NAME/current/etc/#g' $PC
      done

      if [ "$CRAFT_ARCH_TRIPLET_BUILD_FOR" = "x86_64-linux-gnu" ]; then
        sed -i 's#includedir=${prefix}/snap/$CRAFT_PROJECT_NAME/current#includedir=${prefix}#' $CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig/igdgmm.pc
      fi

      LIBTOOLIZE=usr/bin/libtoolize
      sed -i 's#pkgauxdir="$CRAFT_STAGE#pkgauxdir="/snap/$CRAFT_PROJECT_NAME/current#' $LIBTOOLIZE
      sed -i 's#pkgltdldir="$CRAFT_STAGE#pkgltdldir="/snap/$CRAFT_PROJECT_NAME/current#' $LIBTOOLIZE
      sed -i 's#aclocaldir="$CRAFT_STAGE#aclocaldir="/snap/$CRAFT_PROJECT_NAME/current#' $LIBTOOLIZE

      SCANNER=usr/bin/g-ir-scanner
      sed -i 's#$CRAFT_STAGE#/snap/$CRAFT_PROJECT_NAME/current#g' $SCANNER

      ITSTOOL=usr/bin/itstool
      sed -i 's#/usr/local/share#/snap/$CRAFT_PROJECT_NAME/current/usr/local/share#g' $ITSTOOL
      sed -i 's#/usr/share#/snap/$CRAFT_PROJECT_NAME/current/usr/share#g' $ITSTOOL

      GDK_PIXBUF_PATH=usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0
      LOADERS=$GDK_PIXBUF_PATH/2.10.0/loaders.cache
      rm -f $CRAFT_PRIME/$GDK_PIXBUF_PATH/2.10.0/loaders/*.so
      cp -a $CRAFT_STAGE/$GDK_PIXBUF_PATH/2.10.0/loaders/*.so $CRAFT_PRIME/$GDK_PIXBUF_PATH/2.10.0/loaders/
      $GDK_PIXBUF_PATH/gdk-pixbuf-query-loaders $CRAFT_PRIME/$GDK_PIXBUF_PATH/2.10.0/loaders/*.so > $CRAFT_PRIME/$LOADERS
      sed -i 's#/root/parts/gdk-pixbuf/install#/snap/$CRAFT_PROJECT_NAME/current#g' $CRAFT_PRIME/$LOADERS
      sed -i 's#/build/$CRAFT_PROJECT_NAME/parts/gdk-pixbuf/install#/snap/$CRAFT_PROJECT_NAME/current#g' $CRAFT_PRIME/$LOADERS

      XML2_CONFIG=usr/bin/xml2-config
      sed -i 's#/root/parts/debs/install#/snap/$CRAFT_PROJECT_NAME/current#g' $XML2_CONFIG

      rm -f usr/lib/vala-current
      rm -f usr/share/gettext-current
      rm -f usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-current
      ln -s vala-0.56 usr/lib/vala-current
      ln -s gettext-0.19.8 usr/share/gettext-current
      ln -s gdk-pixbuf-2.0/2.10.0 usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-current

      # Necessary for armhf builds, triggers review warning
      if [ "$CRAFT_ARCH_TRIPLET_BUILD_FOR" = "arm-linux-gnueabihf" ]; then
        execstack --clear-execstack  usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libde265.so.0*
      fi
      PYTHONDONTWRITEBYTECODE=1 $CRAFT_PROJECT_DIR/tools/check_broken_links.py $CRAFT_PRIME

  # Used by the gnome snapcraft extensions to load translations from within the content snap
  bindtextdomain:
    after: [ conditioning ]
    plugin: nil
    override-build: |
      set -eux
      mkdir -p $CRAFT_PART_INSTALL/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      gcc -Wall -O2 -o $CRAFT_PART_INSTALL/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/bindtextdomain.so -fPIC -shared $CRAFT_PROJECT_DIR/tools/bindtextdomain.c -ldl

  cleanup:
    after: [ conditioning ]
    plugin: nil
    build-packages:
      - python3-pip
      - zip
      - python3-apt
    override-pull: |
      craftctl default
      python3 -m pip install --break-system-packages pyyaml pyelftools
    override-prime: |
      set -eux

      rm -rf root
      rm -rf usr/share/doc
      rm -rf usr/share/gtk-doc
      rm -rf usr/share/man
      rm -rf usr/share/bash-completion
      find usr -type d -name installed-tests -exec rm -rfv '{}' \; || true
      find usr -type f,l -name '*.la' -print -delete;

      # Cleanup from libunity addition
      rm -f usr/bin/dbus-binding-tool
      rm -f usr/bin/unity-scope-loader
      rm -rf usr/lib/python2.7
      rm -f usr/share/glib-2.0/schemas/com.canonical.Unity.Lenses.gschema.xml
      rm -rf usr/share/lintian/overrides
      rm -rf usr/share/locale-langpack/kab
      rm -f usr/share/unity/client-scopes.json

      find . -type d -empty -delete

      PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DEBUG_BUILDID=usr/lib/debug/.build-id
      mkdir -p $DEBUG_BUILDID

      OLDPATH=$PATH
      $CRAFT_PROJECT_DIR/tools/strip_binaries.py $CRAFT_PRIME $DEBUG_BUILDID
      PATH=$OLDPATH
      echo Symbols compressed
      rm -fr $DEBUG_BUILDID

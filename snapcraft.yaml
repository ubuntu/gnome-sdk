name: gnome-core26-sdk
version: git
summary: Shared GNOME Ubuntu stack SDK
description: |
  This snap contains the GNOME development files. These are used during the build process of snaps that depend on the GNOME stack. This helps developers to make sure their application is built against the correct verson of GNOME and GTK libraries.
  
  **For users**

  This snap is automatically installed and removed when needed. **Manually adding or removing this snap is not recommended** and might break things.

  * If you are having issues with **snaps** using GNOME, please contact the experts on the Snapcraft forum: https://forum.snapcraft.io/
  * If you want to install the GNOME Desktop Environment, then you are in the wrong place. Please take a look at https://www.gnome.org/ for more information on how to get it.

  **For developers**

  * The `gnome` extension is the recommended way to use this in your own snap: https://snapcraft.io/docs/gnome-extension
  * You can report issues with this SDK snap on GitHub: https://github.com/ubuntu/gnome-sdk/issues
  * The source code of this snap is available on GitHub in the `gnome-core26-sdk` branch: https://github.com/ubuntu/gnome-sdk/tree/gnome-core26-sdk
  * This snap is used for building snaps of applications using GNOME or GTK. If you are looking for instructions on how to build GNOME applications instead, take a look at https://developer.gnome.org/
contact: https://github.com/ubuntu/gnome-sdk/issues

confinement: strict
grade: devel
base: core26
build-base: devel

parts:
  buildenv:
    plugin: nil
    build-environment: &buildenv
      - ACLOCAL_PATH: $CRAFT_STAGE/usr/share/aclocal
      - XDG_DATA_DIRS: $CRAFT_STAGE/usr/share:/usr/share
      - LD_LIBRARY_PATH: "$CRAFT_STAGE/usr/lib/vala-0.56:\
                          $CRAFT_STAGE/usr/lib:\
                          $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR\
                          ${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
      - GDK_PIXBUF_MODULE_FILE: $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders.cache
      - PKG_CONFIG_PATH: "$CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig:\
                          $CRAFT_STAGE/usr/lib/pkgconfig:\
                          $CRAFT_STAGE/usr/share/pkgconfig\
                          ${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
      - PATH: $CRAFT_STAGE/usr/bin:$PATH
      - PYTHONPATH: $CRAFT_STAGE/usr/lib/python3:$CRAFT_STAGE/usr/lib/python3/dist-packages

  apt-file:
    plugin: nil
    build-packages:
      - apt-file
    override-pull: |
      set -eux
      apt-file update

  ninja:
    after: [ apt-file ]
    plugin: nil
    source: https://github.com/ninja-build/ninja.git
    source-tag: 'v1.12.1'
    source-depth: 1
    override-build: |
      rm -rf build
      rm -f ninja
      rm -f ninja_bootstrap
      sed -i 's_^#!/usr/bin/env python$_#!/usr/bin/env python3_g' configure.py
      ./configure.py --bootstrap
      mv ninja ninja_bootstrap
      rm -rf build
      ./ninja_bootstrap
      rm -f ninja_bootstrap
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mv ninja $CRAFT_PART_INSTALL/usr/bin/
    build-packages:
      - python3

  meson-deps:
    after: [ ninja ]
    plugin: nil
    source: https://github.com/mesonbuild/meson.git
    source-tag: '1.8.4'
    source-depth: 1
    override-build: |
      python3 -m pip install --break-system-packages .
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages
      rm -rf $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/meson*
      python3 -m pip install --target=$CRAFT_PART_INSTALL/usr --break-system-packages .
      mv $CRAFT_PART_INSTALL/usr/meson* $CRAFT_PART_INSTALL/usr/lib/python3/dist-packages/
      sed -i "s%^#!/usr/bin/python3$%#!/usr/bin/env python3%g" /usr/local/bin/meson
      sed -i "s%^#!/usr/bin/python3$%#!/usr/bin/env python3%g" $CRAFT_PART_INSTALL/usr/bin/meson
    build-packages:
      - python3-pip
      - meson

  libtool:
    plugin: nil
# ext:updatesnap
#   version-format:
#     ignore: true
    stage-packages:
      - libtool
      - libtool-bin
      - libcrypt1
      - libc6
    override-stage: |
      set -eux
      craftctl default
      LIBTOOLIZE=usr/bin/libtoolize
      sed -i 's#pkgauxdir="#pkgauxdir="$CRAFT_STAGE#' $LIBTOOLIZE
      sed -i 's#pkgltdldir="#pkgltdldir="$CRAFT_STAGE#' $LIBTOOLIZE
      sed -i 's#aclocaldir="#aclocaldir="$CRAFT_STAGE#' $LIBTOOLIZE
      PYTHONDONTWRITEBYTECODE=1 $CRAFT_PROJECT_DIR/tools/check_broken_links.py $CRAFT_STAGE

  fontconfig:
    after: [ libtool ]
    source: https://gitlab.freedesktop.org/fontconfig/fontconfig.git
    source-tag: 2.15.0
    source-depth: 1
    plugin: autotools
    autotools-configure-parameters:
      - --prefix=/usr
      - --libdir=/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    build-environment: *buildenv
    override-pull: |
      craftctl default
      patch -p1 < $CRAFT_PROJECT_DIR/patches/fontconfig-delay.patch
    stage:
      - usr/bin/fc-cache

  libffi:
    after: [ libtool ]
    source: https://github.com/libffi/libffi.git
    source-tag: 'v3.5.2'
    source-depth: 1
    plugin: autotools
    autotools-configure-parameters:
      - --prefix=/usr
      - --libdir=/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
    build-environment: *buildenv
    build-packages:
      - texinfo
      - libltdl-dev

  glib:
    after: [ libffi, meson-deps ]
    source: https://gitlab.gnome.org/GNOME/glib.git
    source-tag: '2.84.4'
# ext:updatesnap
#   version-format:
#     ignore-odd-minor: true
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dintrospection=enabled
    build-environment: *buildenv
    override-build: |
      set -eux
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/
      cp $CRAFT_PART_INSTALL/usr/bin/{gio-querymodules,glib-compile-schemas} $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/glib-2.0/
    build-packages:
      - pkg-config
      - libmount-dev
      - gcc
      - g++
      - clang
# Use the packages rather than the gobject-introspection part to avoid a depends cycle
      - gir1.2-glib-2.0-dev
      - gobject-introspection

  pixman:
    after: [ glib, meson-deps ]
    source: https://gitlab.freedesktop.org/pixman/pixman.git
    source-tag: 'pixman-0.46.4'
# ext:updatesnap
#   version-format:
#     format: 'pixman-%M.%m.%R'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dgtk=disabled
      - -Dtests=disabled
      - -Ddemos=disabled
    build-environment: *buildenv

  cairo:
    after: [ pixman, meson-deps ]
    source: https://gitlab.freedesktop.org/cairo/cairo.git
    source-tag: '1.18.4'
# ext:updatesnap
#   version-format:
#     ignore-version: '1.17.8'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dxlib=enabled
      - -Dpng=enabled
      - -Dxcb=enabled
      - -Dtee=enabled
      - -Dzlib=enabled
      - -Dtests=disabled
    build-environment: *buildenv
    build-packages:
      - libfontconfig1-dev
      - libfreetype-dev
      - libx11-dev
      - libxext-dev
      - libxcb1-dev
      - libxcb-render0-dev
      - libxcb-shm0-dev
      - libsm-dev
      - zlib1g-dev
      - liblzo2-dev

  gobject-introspection:
    after: [ cairo, meson-deps ]
    source: https://gitlab.gnome.org/GNOME/gobject-introspection.git
    source-tag: '1.84.0'
# ext:updatesnap
#   version-format:
#     ignore-odd-minor: true
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dgtk_doc=false
      - -Ddoctool=enabled
    build-environment: *buildenv
    override-build: |
      set -eux
      craftctl default
      sed -i "s#\([\"\']\)/usr/\([^\"\']*\)#os.environ.get\('CRAFT_STAGE'\) + \1/usr/\2#g" $CRAFT_PART_INSTALL/usr/bin/g-ir-scanner
    build-packages:
      - python3-dev
      - bison
      - flex

  vala:
    after: [ gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/vala.git
    source-tag: '0.56.18'
    source-depth: 1
# ext:updatesnap
#   version-format:
#     ignore-odd-minor: true
    plugin: autotools
    autotools-configure-parameters: [ --prefix=/usr ]
    build-environment: *buildenv
    build-packages:
      - autoconf-archive
      - valac
      - libgraphviz-dev

  at-spi2-core:
    after: [ glib, gobject-introspection, meson-deps ]
    source: https://gitlab.gnome.org/GNOME/at-spi2-core.git
    source-tag: 'AT_SPI2_CORE_2_52_0'
# ext:updatesnap
#   version-format:
#     format: 'AT_SPI2_CORE_%M_%m_%R'
#     lower-than: 2.53
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dintrospection=enabled
      - -Ddocs=false
    build-environment: *buildenv
    build-packages:
      - libdbus-1-dev
      - libxtst-dev

  fribidi:
    after: [ meson-deps ]
    source: https://github.com/fribidi/fribidi.git
    source-tag: 'v1.0.16'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Ddocs=false
      - -Dtests=false
    build-environment: *buildenv

  harfbuzz:
    after: [ fribidi, meson-deps, gobject-introspection ]
    source: https://github.com/harfbuzz/harfbuzz.git
    source-tag: '11.4.5' # developers declared that they won't break ABI
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Dgraphite2=enabled
      - -Dintrospection=enabled
      - -Dgobject=enabled
      - -Doptimization=3
      - -Ddebug=true
      - -Dtests=disabled
      - -Ddocs=disabled
      - --default-library=both
    build-environment: *buildenv
    override-build: |
      set -eux
      craftctl default
      for PC in $CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig/harfbuzz*.pc;
      do
        sed -i 's#exec_prefix=/usr#exec_prefix=${prefix}#' $PC
        sed -i 's#libdir=/usr#libdir=${prefix}#' $PC
        sed -i 's#includedir=/usr#includedir=${prefix}#' $PC
      done
    build-packages:
      - ragel
      - libgraphite2-dev

  pango:
    after: [ libffi, harfbuzz, meson-deps, gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/pango.git
    source-tag: '1.56.4'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dbuild-testsuite=false
      - -Ddocumentation=false
      - -Dintrospection=enabled
      - -Dbuild-examples=false
    build-environment: *buildenv
    build-packages:
      - libthai-dev
      - libxft-dev
      - libxrender-dev
      - libxt-dev
      - cmake

  gdk-pixbuf:
    after: [ pango, meson-deps, gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/gdk-pixbuf.git
    source-tag: '2.42.12'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dinstalled_tests=false
      - -Dgtk_doc=false
      - -Ddocs=false
      - -Dintrospection=enabled
      - -Dman=false
      - -Dtests=false
      - -Dinstalled_tests=false
    build-environment: *buildenv
    override-build: |
      set -eux
      craftctl default
      cp $CRAFT_PART_INSTALL/usr/bin/gdk-pixbuf-query-loaders $CRAFT_STAGE/usr/bin/
      LOADERS_PATH=$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/2.10.0/loaders
      $CRAFT_PART_INSTALL/usr/bin/gdk-pixbuf-query-loaders $LOADERS_PATH/*.so > $LOADERS_PATH.cache
      # workaround for thumbnailer being in a different directory in the snap env
      sed -i 's#/usr/bin/##' $CRAFT_PART_INSTALL/usr/share/thumbnailers/gdk-pixbuf-thumbnailer.thumbnailer
    organize:
      usr/bin/gdk-pixbuf-query-loaders: usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders
    build-packages:
      - libpng-dev
      - libjpeg-dev
      - libtiff-dev

  librsvg:
    after: [ gdk-pixbuf, vala, meson-deps, gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/librsvg.git
    source-tag: '2.61.1' # they left the odd->unstable even->stable scheme, and now all tags are stable
# ext:updatesnap
#   version-format:
#     no-9x-revisions: true
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dintrospection=enabled
      - -Dvala=enabled
      - -Dpixbuf=enabled
      - -Dpixbuf-loader=enabled
      - -Ddocs=disabled
      - -Dtests=false
    build-environment: *buildenv
    build-packages:
      - libssl-dev
      - meson
      - curl
      - cargo-1.82
    override-pull: |
      craftctl default
      meson subprojects download
      # This avoids crate downloads at the build lifecycle, which comes too late
      # in RISC-V Launchpad builders, so that it errors with HTTP 407.
      # No blooming idea why '~/.cargo/bin/cargo update' does not suffice;
      # launchpad.net/~desktop-snappers/+snap/gnome-46-2404-sdk/+build/2931431
      # shows it does not.
      if test "$CRAFT_ARCH_BUILD_FOR" = riscv64; then
        cargo-1.82 update
      fi
      # cargo version in .deb is too old
      curl https://sh.rustup.rs -sSf > cargo.sh
      sh ./cargo.sh -y
      export PATH=$PATH:$HOME/.cargo/bin
      ~/.cargo/bin/cargo install cargo-c --locked
      cp ~/.cargo/bin/* /usr/local/bin
    override-stage: |
      craftctl default
      sed -i 's#prefix=$CRAFT_STAGE${pcfiledir}#prefix=${pcfiledir}#' $CRAFT_STAGE/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/pkgconfig/librsvg-2.0.pc

  epoxy:
    after: [ librsvg, meson-deps ]
    source: https://github.com/anholt/libepoxy.git
    source-tag: '1.5.10'  # Note minor version of tag/branch can be even or odd and be stable
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dtests=false
    build-environment: *buildenv
    build-packages:
      - libgl1-mesa-dev
      - libegl1-mesa-dev
      - xutils-dev

  json-glib:
    after: [ epoxy, meson-deps, gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/json-glib.git
    source-tag: '1.10.8'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dgtk_doc=disabled
      - -Dintrospection=enabled
      - -Ddocumentation=disabled
      - -Dtests=false
    build-environment: *buildenv

  libpsl:
    after: [ json-glib, meson-deps ]
    source: https://github.com/rockdaboot/libpsl.git
    source-tag: '0.21.5'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Druntime=libidn2
      - -Dtests=false
      - -Doptimization=3
      - -Ddebug=true
    build-environment: *buildenv
    build-packages:
      - libidn2-dev
      - libunistring-dev
    override-pull: |
      set -eux
      craftctl default
      meson subprojects download
      sed -i 's#^\#!/usr/bin/env python$#\#!/usr/bin/env python3#g' src/psl-make-dafsa

  libsoup3:
    after: [ libpsl, meson-deps, vala, gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/libsoup.git
    source-tag: '3.6.5'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dvapi=enabled
      - -Dtls_check=false #disable build time check, but we need to ensure glib-networking is available at runtime
      - -Dintrospection=enabled
      - -Ddocs=disabled
      - -Dtests=false
    build-environment: *buildenv
    build-packages:
      - libsqlite3-dev
      - libkrb5-dev
      - libbrotli-dev
      - libnghttp2-dev

  librest:
    after: [ libsoup3, meson-deps, gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/librest.git
    source-tag: '0.10.2'
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dintrospection=true
      - -Dexamples=false
      - -Dgtk_doc=false
      - -Dsoup2=false
      - -Dtests=false
    build-environment: *buildenv
    build-packages:
      - gtk-doc-tools

  wayland-protocols:
    after: [ meson-deps ]
    source: https://gitlab.freedesktop.org/wayland/wayland-protocols.git
    source-tag: '1.45'
    source-depth: 1
    build-packages:
      - libwayland-dev
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dtests=false
    build-environment: *buildenv

  gtk3:
    after: [ wayland-protocols, harfbuzz, pango, meson-deps, gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/gtk.git
    source-tag: '3.24.50'
# ext:updatesnap
#   version-format:
#     ignore-odd-minor: true
#     lower-than: 4
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dbroadway_backend=true
      - -Dx11_backend=true
      - -Dwayland_backend=true
      - -Dwin32_backend=false
      - -Dquartz_backend=false
      - -Dxinerama=yes
      - -Dintrospection=true
      - -Dbuiltin_immodules=yes
      - -Ddemos=false
      - -Dexamples=false
      - -Dtests=false
    build-environment: *buildenv
    organize:
      usr/lib/gtk-3.0: usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gtk-3.0
      usr/bin/gtk-query-immodules-3.0: usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/libgtk-3-0/gtk-query-immodules-3.0
    build-packages:
      - libxkbcommon-dev
      - libxinerama-dev
      - libcups2-dev
      - libcolord-dev
      - libwayland-dev
      - libxrandr-dev
      - libxcursor-dev
      - libxcomposite-dev
      - libxdamage-dev
      - libxfixes-dev
      - libxi-dev
      - libxkbfile-dev
      - libxml2-utils
    override-pull: |
      craftctl default
      patch -p1 < $CRAFT_PROJECT_DIR/patches/gdkglcontext-wayland-Fallback-to-GLES-2_0-after-GL-failed.patch

  gtk4:
    after: [ wayland-protocols, harfbuzz, pango, meson-deps, gobject-introspection ]
    source: https://gitlab.gnome.org/GNOME/gtk.git
    source-tag: '4.18.6'
# ext:updatesnap
#   version-format:
#     ignore-odd-minor: true
    source-depth: 1
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dbroadway-backend=true
      - -Dx11-backend=true
      - -Dwayland-backend=true
      - -Dwin32-backend=false
      - -Dmacos-backend=false
      - -Dintrospection=enabled
      - -Ddocumentation=false
      - -Dbuild-examples=false
      - -Dbuild-tests=false
      - -Dmedia-gstreamer=enabled
      - -Dbuild-demos=false
      - -Dbuild-testsuite=false
      - -Dbuild-examples=false
      - -Dbuild-tests=false
      - -Dprint-cups=enabled
    build-environment: *buildenv
    organize:
      usr/lib/gtk-4.0: usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/gtk-4.0
    build-packages:
      - libxkbcommon-dev
      - libcups2-dev
      - libcolord-dev
      - libxrandr-dev
      - libxcursor-dev
      - libxcomposite-dev
      - libxdamage-dev
      - libxfixes-dev
      - libxi-dev
      - libxkbfile-dev
      - libxml2-utils
      - libgstreamer-plugins-bad1.0-dev
      - libvulkan-dev
      - libwayland-dev
      - glslc
      - libgraphene-1.0-dev
    stage:
      - -usr/bin/wayland-scanner
      - -usr/lib/*/libwayland-client.so.0.20.0
      - -usr/lib/*/libwayland-server.so.0.20.0

  gtk-locales:
    after: [ gtk3, gtk4 ]
    plugin: nil
    build-environment: *buildenv
    override-pull: |
      set -eux
      apt-get download "language-pack-gnome-*-base"
    override-build: |
      set -eux
      for deb in *.deb; do dpkg-deb -x $deb .; done
      find usr/share/locale-langpack -type f -not -name "gtk30*.mo" -exec rm '{}' \;
      mkdir -p $CRAFT_PART_INSTALL/usr/share
      cp -r usr/share/locale-langpack $CRAFT_PART_INSTALL/usr/share/

  libadwaita:
    source: https://gitlab.gnome.org/GNOME/libadwaita.git
    source-tag: '1.7.7'
    source-depth: 1
    after: [ meson-deps, gtk4, vala, gobject-introspection ]
    plugin: meson
    meson-parameters:
      - --prefix=/usr
      - -Doptimization=3
      - -Ddebug=true
      - -Dintrospection=enabled
      - -Dvapi=true
      - -Dgtk_doc=false
      - -Dtests=false
      - -Dexamples=false
    build-environment: *buildenv
    build-packages:
      - sassc
      - libyaml-dev
      - libzstd-dev
      - libsystemd-dev
      - gperf
      - libappstream-dev
    override-pull: |
      craftctl default
      meson subprojects download
      patch -p1 < $CRAFT_PROJECT_DIR/patches/stylesheet-common-Use-disabled-opacity-for-disabled-pictu.patch
      patch -p1 < $CRAFT_PROJECT_DIR/patches/stylesheet-common-Use-opacity-for-all-disabled-gtk-images.patch
      patch -p1 < $CRAFT_PROJECT_DIR/patches/accent-color-Return-return-orange-as-default-color.patch
      patch -p1 < $CRAFT_PROJECT_DIR/patches/style-manager-Support-Yaru-accent-colors.patch

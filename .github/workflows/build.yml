name: build-test
on:
  pull_request:
  push:
    branches:
      - gnome-42-2204-sdk
      - gnome-46-2404-sdk

jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
    - uses: snapcore/action-build@v1
      id: snapcraft
    - uses: actions/upload-artifact@v4
      with:
        name: 'snap'
        path: ${{ steps.snapcraft.outputs.snap}}
